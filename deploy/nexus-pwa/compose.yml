services:
  nexus-pwa:
    image: nginx:alpine
    container_name: nexus-pwa
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nexus-icon.png:/usr/share/nginx/html/nexus-icon.png:ro
      - ./manifest.webmanifest:/usr/share/nginx/html/manifest.webmanifest:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
