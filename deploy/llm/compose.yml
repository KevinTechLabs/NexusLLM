services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    environment:
      - OLLAMA_HOST=0.0.0.0:11434

    volumes:
      - ollama_data:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped

    depends_on:
      - ollama

    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - EXTERNAL_PWA_MANIFEST_URL=http://192.0.2.10:8081/manifest.webmanifest

    volumes:
      - open_webui_data:/app/backend/data

  nexus-proxy:
    image: nginx:alpine
    container_name: nexus-proxy
    restart: unless-stopped

    depends_on:
      - open-webui

    ports:
      - "3000:80"

    volumes:
      - ./nexus-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nexus-pwa/nexus-icon.png:/usr/share/nginx/html/nexus-icon.png:ro

volumes:
  ollama_data:
  open_webui_data:
