<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
<meta name="apple-mobile-web-app-title" content="Nexus HQ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<title>Nexus HQ</title>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">
      <div class="kicker">// agent operations</div>
      <h1>NEXUS HQ<span class="caret"></span></h1>
    </div>
    <button type="button" id="statusPill" class="status-pill" aria-label="Status: models, GitHub and settings"><i></i><span id="statusTxt">…</span></button>
    <div class="stats" id="stats"></div>
    <nav id="nav" aria-label="Views">
      <button data-view="map">Map</button>
      <button data-view="chat">Chat</button>
      <button data-view="code">Coding</button>
      <button data-view="vault" class="nav-vault">Vault</button>
      <button data-view="photos" class="nav-photos">Photos</button>
      <a href="/compare">Compare</a>
    </nav>
    <button id="logoutBtn" class="logout-btn" type="button" title="Log out" aria-label="Log out" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </header>

  <div id="models" class="models"></div>

  <div class="hq-seg" id="hqSeg" role="tablist" aria-label="HQ view">
    <button type="button" data-hqview="map">Map</button>
    <button type="button" data-hqview="chat">Chat dept</button>
    <button type="button" data-hqview="code">Coding dept</button>
  </div>

  <main id="viewport">
    <div id="stage"></div>
    <div id="deptSwitch" class="dept-switch" hidden>
      <button id="prevDept" aria-label="Previous department">‹</button>
      <span id="deptName"></span>
      <button id="nextDept" aria-label="Next department">›</button>
    </div>
  </main>

  <section id="console" class="console" aria-label="Command console">
    <div class="con-head" id="conHead">
      <span class="kicker">// command console</span>
      <span class="con-status" id="conStatus">idle</span>
      <span class="con-title" id="conTitle"></span>
      <div class="con-actions">
        <button type="button" class="con-btn proj" id="conProject" data-con="files" title="Open project files" hidden></button>
        <button type="button" class="con-btn" data-con="new" title="Start a new chat">+ New</button>
        <button type="button" class="con-btn" data-con="chats" title="Saved chats">Chats</button>
        <button type="button" class="con-btn icon" data-con="full" id="conFullBtn" aria-label="Full screen console" title="Full screen">⛶</button>
        <button id="conToggle" class="con-btn icon" type="button" aria-label="Collapse console">▾</button>
      </div>
    </div>
    <div class="con-body">
      <div class="con-log" id="conLog" aria-live="polite"></div>
      <div class="con-drawer" id="conDrawer" hidden>
        <div class="dr-head"><b>Saved chats</b><span class="dim">shared by every device</span>
          <button type="button" class="con-btn" data-con="new">+ New chat</button>
          <button type="button" class="con-btn icon" data-con="close-drawer" aria-label="Close saved chats">✕</button></div>
        <div class="dr-list" id="conList"></div>
      </div>
    </div>
    <div class="con-tray" id="conTray" hidden></div>
    <button type="button" class="ask-peek" id="askPeek" hidden></button>
    <div class="plus-menu" id="plusMenu" hidden>
      <button type="button" data-plus="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Photo library</button>
      <button type="button" data-plus="camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Take photo</button>
      <button type="button" data-plus="web"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg><span id="plusWeb">Web search: auto</span></button>
    </div>
    <form class="con-input" id="conForm" autocomplete="off">
      <button type="button" id="conPlus" class="con-plus" aria-label="Photos and web search">+</button>
      <button type="button" id="conWeb" class="con-web" data-con="web">WEB</button>
      <button type="button" id="conAttach" class="con-ico" title="Attach photos (or paste / drop them)" aria-label="Attach photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>
      <button type="button" id="conCam" class="con-ico cam" title="Take a photo" aria-label="Take a photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
      <input type="file" id="conFile" accept="image/*" multiple hidden>
      <input type="file" id="conCamFile" accept="image/*" capture="environment" hidden>
      <span class="prompt">nexus@hq:~$</span>
      <input id="conInput" enterkeyhint="send" spellcheck="false" placeholder="ask anything… HQ picks the agent (/help)">
      <button id="conRun" class="btn primary" type="submit">Run</button>
    </form>
  </section>

  <div class="panel-clip">
    <aside id="panel" aria-hidden="true">
      <div class="panel-frame" id="panelBody"></div>
    </aside>
  </div>
  <div id="scrim"></div>
</div>

<div id="login" class="login" hidden>
  <div class="login-card" role="dialog" aria-labelledby="loginTitle">
    <div class="kicker">// secure uplink</div>
    <h1 id="loginTitle">NEXUS HQ<span class="caret"></span></h1>
    <div class="login-sub">agent operations · restricted access</div>
    <form id="loginForm" autocomplete="on">
      <input type="text" name="username" value="nexus" autocomplete="username" hidden>
      <label for="loginPw">Access key</label>
      <div class="login-field"><span aria-hidden="true">&gt;</span>
        <input id="loginPw" type="password" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="enter password">
      </div>
      <button id="loginBtn" class="login-btn" type="submit">Authenticate</button>
    </form>
    <div class="login-log" id="loginLog" aria-live="polite"></div>
  </div>
  <div class="login-foot">private network · this device stays signed in</div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button type="button" data-tab="hq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="4.5" cy="6" r="2"/><circle cx="19.5" cy="6" r="2"/><circle cx="4.5" cy="18" r="2"/><circle cx="19.5" cy="18" r="2"/><path d="M6.2 7.2 9.6 10M17.8 7.2 14.4 10M6.2 16.8l3.4-2.8M17.8 16.8l-3.4-2.8"/></svg><span>HQ</span></button>
  <button type="button" data-tab="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Ask</span><i class="tab-dot" id="askDot" hidden></i></button>
  <button type="button" data-tab="vault"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 22V12M3 7l9 5 9-5"/></svg><span>Vault</span></button>
  <button type="button" data-tab="photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>Photos</span></button>
</nav>
<div class="sheet-back" id="sheetBack" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="Status"></div>
<script src="/app.js"></script>
<script src="/vault.js"></script>
<script src="/photos.js"></script>
<script src="/phone.js"></script>
</body>
</html>
